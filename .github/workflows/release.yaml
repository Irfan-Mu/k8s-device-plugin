# Run this workflow on new tags
name: Release

on:
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Check out code

      - name: Install Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: 3.14.4

      - name: Generate Helm Charts
        run: |
          ./hack/package-helm-charts.sh ${{ github.ref_name }}

      # - name: Push Helm Charts to OCI
