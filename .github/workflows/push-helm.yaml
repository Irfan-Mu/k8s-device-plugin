name: Push Chart to OCI

on:
  push:
    branches:
      - '**'

jobs:
  push-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Set chart version based on branch
        id: set_version
        run: |
          set -euxo pipefail

          # Get the base version from Chart.yaml
          BASE_VERSION=$(awk -F= '/^VERSION/ { print $2 }' versions.mk | tr -d '[:space:]')

          BRANCH_NAME="${GITHUB_REF##*/}"
          SAFE_BRANCH=$(echo "${BRANCH_NAME}" | sed 's/[^0-9A-Za-z.-]/-/g')
          SHORT_SHA=$(echo -n "$BRANCH_NAME" | sha1sum | awk '{print $1}' | cut -c1-7)
          VERSION="${BASE_VERSION}-${SAFE_BRANCH}-${SHORT_SHA}"

          echo "Computed version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push helm chart
        run: |
          # Lowercase repository name
          REPOSITORY=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          VERSION=${{ steps.set_version.outputs.VERSION }}
          CHART_NAME=$(yq -r .name ./deployments/helm/nvidia-device-plugin/Chart.yaml)

          helm package ./deployments/helm/nvidia-device-plugin --version "$VERSION"

          PACKAGE_FILE="${CHART_NAME}-${VERSION}.tgz"

          helm push "$PACKAGE_FILE" oci://${REPOSITORY}/charts
